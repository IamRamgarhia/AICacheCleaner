name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The regression gate: catches contract drift between API handlers and
      # their helper functions BEFORE it ships (the bug class that previously
      # slipped through because esbuild transpiles without type-checking).
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Guards the v1.0.0 regression where the packaged app could not delete
      # anything: esbuild stubbed import.meta.url inside the ESM-only `trash`
      # package. The test bundles with production flags and deletes a real file,
      # so it fails if that ever regresses. API-guard tests self-skip when no
      # backend is listening.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
