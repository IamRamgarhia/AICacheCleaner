name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Typecheck · Lint · Test · Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The app's paths, Recycle Bin handling and sizing differ per OS, so
        # every one of them is exercised on the OS it targets.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The regression gate: catches contract drift between API handlers and
      # their helper functions BEFORE it ships (the bug class that previously
      # slipped through because esbuild transpiles without type-checking).
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Includes the v1.0.0 regression guard (bundled `trash` must really move a
      # file to the Recycle Bin / Trash), the delete-safety rules and the
      # Windows-only sizing helper (self-skips elsewhere). API-guard tests
      # self-skip when no backend is listening.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # UI flows against a mocked API — never touches this runner's files.
      - name: E2E (UI)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
