<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free up disk space by safely cleaning Claude Desktop cache, Cursor cache, Ollama model weights & Antigravity/Gemini storage. 100% safe restore points. FOSS for Windows & macOS." />
    <meta name="keywords" content="claude cache cleaner, cursor cache cleanup, clean ollama disk space, ai cache cleaner, free up disk space, antigravity gemini storage, claude desktop cache, cursor editor cache" />
    <title>AICacheCleaner — Clean Claude, Cursor & Ollama Cache | Free Up Disk Space</title>
    <style>
      body {
        margin: 0;
        background-color: #0b0f19;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      .app-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background: radial-gradient(circle at center, #131b2e 0%, #0b0f19 100%);
      }
      .splash-logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 35px rgba(0, 242, 254, 0.5);
        margin-bottom: 20px;
        animation: pulseLogo 2s infinite ease-in-out;
      }
      .splash-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(0, 242, 254, 0.2);
        border-top: 3px solid #00f2fe;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 18px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); box-shadow: 0 0 35px rgba(0, 242, 254, 0.4); }
        50% { transform: scale(1.06); box-shadow: 0 0 55px rgba(0, 242, 254, 0.7); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-splash">
        <div class="splash-logo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0b0f19" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <h1 style="font-size: 1.4rem; font-weight: 800; margin: 0; background: linear-gradient(90deg, #ffffff, #00f2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
          AICacheCleaner
        </h1>
        <p style="font-size: 0.85rem; color: #9ca3af; margin: 6px 0 0 0;">
          ⚡ Initializing High-Speed Local Engine...
        </p>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
