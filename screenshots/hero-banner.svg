<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="AICacheCleaner — Clean Claude, Cursor & Ollama Cache to Free Up Disk Space">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#131b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="1" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- Logo shield -->
  <g transform="translate(70,120)" filter="url(#glow)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#accent)"/>
    <path d="M60 95 C60 95 95 75 95 50 V30 L60 18 L25 30 V50 C25 75 60 95 60 95 Z" fill="none" stroke="#0b0f19" stroke-width="5" stroke-linejoin="round"/>
    <path d="M44 58 L54 68 L78 44" fill="none" stroke="#0b0f19" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="220" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">AICacheCleaner</text>
  <text x="222" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#9ca3af">Clean Claude, Cursor &amp; Ollama Cache — Free Up Disk Space</text>

  <!-- Stats badges -->
  <g transform="translate(222,230)">
    <rect x="0" y="0" width="200" height="56" rx="12" fill="rgba(0,242,254,0.08)" stroke="#00f2fe" stroke-opacity="0.4"/>
    <text x="100" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#00f2fe">100% Safe</text>
    <text x="100" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9ca3af">Restore Points</text>
  </g>
  <g transform="translate(432,230)">
    <rect x="0" y="0" width="200" height="56" rx="12" fill="rgba(157,78,221,0.08)" stroke="#9d4edd" stroke-opacity="0.4"/>
    <text x="100" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#a855f7">FOSS</text>
    <text x="100" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9ca3af">MIT License</text>
  </g>
  <g transform="translate(642,230)">
    <rect x="0" y="0" width="200" height="56" rx="12" fill="url(#green)" opacity="0.15"/>
    <rect x="0" y="0" width="200" height="56" rx="12" fill="none" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="100" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#34d399">Offline</text>
    <text x="100" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9ca3af">Zero Telemetry</text>
  </g>

  <!-- Supported tools strip -->
  <text x="70" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#6b7280">Supports:</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    <text x="150" y="320" fill="#00f2fe">Claude</text>
    <text x="225" y="320" fill="#9ca3af">•</text>
    <text x="245" y="320" fill="#00f2fe">Cursor</text>
    <text x="320" y="320" fill="#9ca3af">•</text>
    <text x="340" y="320" fill="#00f2fe">Ollama</text>
    <text x="425" y="320" fill="#9ca3af">•</text>
    <text x="445" y="320" fill="#00f2fe">Antigravity</text>
    <text x="555" y="320" fill="#9ca3af">•</text>
    <text x="575" y="320" fill="#00f2fe">Gemini</text>
    <text x="650" y="320" fill="#9ca3af">•</text>
    <text x="670" y="320" fill="#00f2fe">HuggingFace</text>
    <text x="780" y="320" fill="#9ca3af">•</text>
    <text x="800" y="320" fill="#00f2fe">Continue.dev</text>
    <text x="915" y="320" fill="#9ca3af">•</text>
    <text x="935" y="320" fill="#00f2fe">LM Studio</text>
  </g>
</svg>
